<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#060913" />
    </linearGradient>

    <linearGradient id="primaryText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="glowG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6" />
      <circle cx="40" cy="40" r="1.5" fill="#334155" opacity="0.5" />
    </pattern>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dynamic pulsing and flow animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.55; transform: scale(1.12); }
    }
    @keyframes dashTravel {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes nodePing {
      0%, 100% { r: 4; fill-opacity: 0.4; }
      50% { r: 6.5; fill-opacity: 1; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .g-glow {
      transform-origin: 600px 210px;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .flow-path {
      stroke-dasharray: 10, 14;
      animation: dashTravel 14s linear infinite;
    }
    .ping-1 { animation: nodePing 2.5s ease-in-out infinite; }
    .ping-2 { animation: nodePing 3s ease-in-out infinite 0.8s; }
    .ping-3 { animation: nodePing 2.8s ease-in-out infinite 1.6s; }
    .pill-float { animation: floatPill 4s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Technical Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Ambient Glow in Background (never blocks text) -->
  <circle cx="600" cy="210" r="320" fill="url(#glowG)" class="g-glow" />

  <!-- Decorative Circuit / Recovery Flow Lines (Background) -->
  <g opacity="0.35">
    <path class="flow-path" d="M 80 80 Q 300 30 600 60 T 1120 70" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <path class="flow-path" d="M 80 340 Q 400 390 750 350 T 1120 330" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <path class="flow-path" d="M 120 180 C 250 140, 350 260, 480 200" fill="none" stroke="#0ea5e9" stroke-width="1.2" />
    <path class="flow-path" d="M 720 220 C 850 270, 950 160, 1080 210" fill="none" stroke="#a855f7" stroke-width="1.2" />
  </g>

  <!-- Network Nodes with Pulse Effect (Background Layer) -->
  <circle cx="280" cy="50" r="4" fill="#38bdf8" class="ping-1" />
  <circle cx="920" cy="65" r="4" fill="#c084fc" class="ping-2" />
  <circle cx="480" cy="200" r="4.5" fill="#38bdf8" class="ping-3" />
  <circle cx="720" cy="220" r="4.5" fill="#a855f7" class="ping-1" />
  <circle cx="350" cy="370" r="4" fill="#818cf8" class="ping-2" />
  <circle cx="880" cy="340" r="4" fill="#38bdf8" class="ping-3" />

  <!-- Center Decorative Glow Divider -->
  <rect x="250" y="278" width="700" height="1.5" fill="url(#accentLine)" />

  <!-- FOREGROUND CONTENT: Header, Shield, Typography & Feature Badges -->
  <g transform="translate(600, 75)">
    <!-- Shield & Recovery Symbol -->
    <g transform="translate(-32, 0)">
      <polygon points="32,4 60,16 60,42 32,60 4,42 4,16" fill="url(#shieldGrad)" opacity="0.9" filter="url(#glowFilter)" />
      <polygon points="32,7 56,18 56,40 32,56 8,40 8,18" fill="#0b1329" />
      <!-- Rollback circular arrow inside shield -->
      <path d="M 32 20 A 13 13 0 1 0 43 35 M 43 25 L 43 35 L 33 35" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Foreground Title -->
  <text x="600" y="185" text-anchor="middle" font-size="40" font-weight="800" fill="url(#primaryText)" letter-spacing="1.2">
    Automated Ransomware Recovery &amp; Rollback
  </text>

  <!-- Foreground Subtitle -->
  <text x="600" y="232" text-anchor="middle" font-size="18" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
    Clean Rooms • Immutable Backups • Threat Detection • Rapid Automated Rollback
  </text>

  <text x="600" y="260" text-anchor="middle" font-size="14" font-weight="400" fill="#64748b" letter-spacing="0.3">
    Enterprise SaaS Platforms &amp; Open-Source Cyber Resilience Ecosystem
  </text>

  <!-- Foreground Dynamic Interactive Feature Pills (Bottom Row) -->
  <g class="pill-float" transform="translate(190, 310)">
    <!-- Pill 1: Cleanroom IRE -->
    <g transform="translate(0, 0)">
      <rect width="180" height="38" rx="19" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" opacity="0.95" />
      <circle cx="22" cy="19" r="6" fill="#0284c7" />
      <text x="36" y="24" fill="#e2e8f0" font-size="12.5" font-weight="600">Clean Room IRE</text>
    </g>

    <!-- Pill 2: Immutable Storage -->
    <g transform="translate(205, 0)">
      <rect width="195" height="38" rx="19" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" opacity="0.95" />
      <circle cx="22" cy="19" r="6" fill="#6366f1" />
      <text x="36" y="24" fill="#e2e8f0" font-size="12.5" font-weight="600">Immutable Backups</text>
    </g>

    <!-- Pill 3: Automated Rollback -->
    <g transform="translate(425, 0)">
      <rect width="195" height="38" rx="19" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" opacity="0.95" />
      <circle cx="22" cy="19" r="6" fill="#a855f7" />
      <text x="36" y="24" fill="#e2e8f0" font-size="12.5" font-weight="600">Zero-Downtime Rollback</text>
    </g>

    <!-- Pill 4: Threat Hunting -->
    <g transform="translate(645, 0)">
      <rect width="175" height="38" rx="19" fill="#0f172a" stroke="#10b981" stroke-width="1.2" opacity="0.95" />
      <circle cx="22" cy="19" r="6" fill="#10b981" />
      <text x="36" y="24" fill="#e2e8f0" font-size="12.5" font-weight="600">MITRE IOC Scanners</text>
    </g>
  </g>
</svg>
